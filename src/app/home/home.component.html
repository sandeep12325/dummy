<div class="m-5">
    <div>
        <table class="table table-bordered">
            <thead class="table-light">
                <tr>
                    <th>Name</th>
                    <th>Email</th>
                    <th>Mobile</th>
                    <th>Action</th>
                </tr>
            </thead>
            <tbody>
                <tr *ngFor="let item of userlist">
                    <td>{{item.name}}</td>
                    <td>{{item.email}}</td>
                    <td>{{item.mobile}}</td>
                    <td>
                        <button class="btn btn-primary m-1" (click)="onEdit(item)">Edit</button>
                        <button class="btn btn-primary" (click)="Ondelete(item)">Delet</button>
                    </td>
                </tr>
            </tbody>
        </table>
    </div>


    <h4>NG Select</h4>
    <div>
        <form [formGroup]="selectfrom" (ngSubmit)="onSelect()">
            <ng-select [items]="userlist" bindLabel="name" bindValue="name" placeholder="select any value"
                [multiple]="false" formControlName="username">
            </ng-select>

            <button class="btn btn-primary mt-1" type="submit">Submit</button>
        </form>
    </div>


    <!-- ----forms -->
    <div class="mt-5 border p-4">
        <form [formGroup]="updateform" (ngSubmit)="Onupdate()">
            <div class="row mb-3">
                <label for="inputEmail3" class="col-sm-2 col-form-label">Name</label>
                <div class="col-sm-10">
                    <input type="text" class="form-control" id="inputEmail3" formControlName="name">
                </div>
            </div>
            <div class="row mb-3">
                <label for="inputEmail3" class="col-sm-2 col-form-label">Email</label>
                <div class="col-sm-10">
                    <input type="text" class="form-control" id="inputEmail3" formControlName="email">
                </div>
            </div>
            <div class="row mb-3">
                <label for="inputPassword3" class="col-sm-2 col-form-label">Mobile</label>
                <div class="col-sm-10">
                    <input type="text" class="form-control" id="inputPassword3" formControlName="mobile">
                </div>
            </div>

            <button type="submit" class="btn btn-primary">{{action?'update':'Add'}}</button>
        </form>
    </div>
</div>
