<!-- with out formcintrol -->
<div class="row g-3 container-fluid m-5">

  <div class="col-md-6">
    <label class="form-label">Mobile</label>
    <input 
      type="tel"
      class="form-control"
      name="mobile"
      [(ngModel)]="mobile"
      #m="ngModel"
      [ngModelOptions]="{standalone: true}"
      required>

    <div class="error" *ngIf="m.invalid && m.touched">
      Mobile is required
    </div>
  </div>

  <div class="col-md-6">
    <label class="form-label">Email</label>
    <input 
      type="email"
      class="form-control"
      name="email"
      [(ngModel)]="email"
      #e="ngModel"
      [ngModelOptions]="{standalone: true}"
      required
      email>

    <div class="error" *ngIf="e.touched">
      <div *ngIf="e.errors?.['required']">
        Email is required
      </div>
      <div *ngIf="e.errors?.['email']">
        Invalid email
      </div>
    </div>
  </div>

  <div class="col-12">
    <button 
      type="button" 
      class="btn btn-primary"
      (click)="onSubmit(m, e)">
      Sign in
    </button>
  </div>

</div>

<h1>dymaically add validation and error messages</h1>

<form [formGroup]="myForm" (ngSubmit)="onSubmit1()">

  <!-- Name -->
  <label>Name:</label>
  <input type="text" formControlName="name">
  <div *ngIf="myForm.get('name')?.errors?.['required']">
    Name is required
  </div>

  <br><br>

  <!-- Password -->
  <label>Password:</label>
  <input type="password" formControlName="password">
  <div *ngIf="myForm.get('password')?.errors?.['required']">
    Password is required
  </div>

  <br><br>

  <!-- Has Email -->
  <label>Do you have email?</label>
  <select formControlName="hasEmail">
    <option value="">Select</option>
    <option value="yes">Yes</option>
    <option value="no">No</option>
  </select>

  <br><br>

  <!-- Email -->
  <label>Email:</label>
  <input type="text" formControlName="email">

  <div *ngIf="myForm.get('email')?.errors?.['required'] && myForm.get('email')?.touched">
    Email is required
  </div>

  <div *ngIf="myForm.get('email')?.errors?.['email']">
    Invalid email
  </div>
  <button type="submit" class="btn btn-primary">Submit</button>
</form>
